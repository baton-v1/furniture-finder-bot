services:
  - type: web
    name: furniture-finder-bot
    env: python
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.web:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_US
      - key: DELIVERY_COUNTRY
        value: US
      - key: MAX_RESULTS
        value: "5"
