[project]
name = "furniture-finder-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp-socks>=0.9,<1",
  "aiogram>=3.10,<4",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
